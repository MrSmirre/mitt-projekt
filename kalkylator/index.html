<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <script defer src="index.js"></script>
</head>
<body>
    
    <div class="calculator-body">
    <!-- miniräknare display -->
        <div class="display">
            <input type="number" readonly>
        </div>
        <!-- sifforknapparna -->
        <div class="btns-container">
            <div class="number-container">
                <div class="num-123">
                    <button class="btn-1">1</button>
                    <button class="btn-2">2</button>
                    <button class="btn-3">3</button>
                </div>
                <div class="num-456">
                    <button class="btn-4">4</button>
                    <button class="btn-5">5</button>
                    <button class="btn-6">6</button>
                </div>
                <div class="num-789">
                    <button class="btn-7">7</button>
                    <button class="btn-8">8</button>
                    <button class="btn-9">9</button>
                </div>
                <button class="btn-0">0</button>
                <!-- lika med -->
                <div class="functions">
                    <button class="equal">=</button>
                    <button class="erase">C</button>
                </div>
            </div>

            <!-- plus o minus o gånger o delat me bannizz -->
            <div class="operators-container">
                <div class="plus-minus-times">
                    <button class="plus">+</button>
                    <button class="minus">-</button>
                    <button class="times">X</button>
                </div>
                <button class="divide">/</button>
            </div>

            
        </div>
    </div>
</body>
</html>
