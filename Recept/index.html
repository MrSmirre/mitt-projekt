<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Smart Recept & Kök</title>
		<link rel="stylesheet" href="index.css" />
	</head>
	<body> 
		<div class="container">
			<!-- Rubrik -->
			<header>
				<h1>🍳 Smart Recept- & Kökshjälpare</h1>
			</header>

			<!-- Kontroller -->
			<div class="controls">
				<div class="control-box">
					<h3>Filtrera kategori</h3>
					<p>Visa endast viss mat</p>
					<select id="filter-category">
						<option value="alla">Alla recept</option>
						<option value="Vegetariskt">Vegetariskt</option>
						<option value="Kött">Kött</option>
						<option value="Fisk">Fisk</option>
					</select>
				</div>

				<div class="control-box">
					<div>
						<h3>Portionsräknare</h3>
						<p>Ändra antal personer (påverkar pris)</p>
					</div>

					<div class="portions-control">
						<button id="btn-minus" class="portions-btn">-</button>
						<span id="portions-count" class="portions-count">2</span>st
						<button id="btn-plus" class="portions-btn">+</button>
					</div>
				</div>
			</div>

			<!-- HuvudLayout -->
			<div class="main-layout">
				<!-- Mina recept -->
				<div class="recipes-section">
					<h2>
						<span>Mina Recept</span>
						<span id="recipe-count" class="recipe-count-badge">0 st</span>
					</h2>

					<!-- här kommer recept in via JS -->
					<div id="recipe-container" class="recipe"></div>
				</div>

				<!-- Formulär till att lägga till -->
				<div class="form-section">
					<h2>✍️ Lägg till recept</h2>
					<div class="form-card">
						<form id="add-recipe-form">
							<div class="form-group">
								<label>Receptnamn</label>
								<input type="text" id="input-name" required placeholder="t.ex. Pannkakor" />
							</div>
							<div class="form-group">
								<label>Kategori</label>
								<select id="input-category">
									<option value="Vegetariskt">Vegetariskt</option>
									<option value="Kött">Kött</option>
									<option value="Fisk">Fisk</option>
								</select>
							</div>
							<div class="form-group">
								<label>Pris (kr / portion)</label>
								<input type="text" id="input-price" required placeholder="t.ex. 35" />
							</div>
							<div class="form-group">
								<label>Emoji / Ikon</label>
								<input type="text" id="input-icon" required value="🍲" />
							</div>
							<div class="form-group">
								<label>Ingredienser</label>
								<input
									type="text"
									id="input-ingredients"
									required
									placeholder="t.ex. Mjöl, Ägg, Mjölk"
								/>
							</div>
							<button type="submit" class="btn">Spara Recept</button>
						</form>
					</div>
				</div>
			</div>
		</div>

		<script src="index.js"></script>
	</body>
</html>
