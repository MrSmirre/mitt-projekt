<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="control-item">
                <label for="">Category</label>
                <select name="" id="filter-category">
                    <option value="Alla">Alla</option>
                    <option value="Elektronik">Elektronik</option>
                    <option value="Kläder">Kläder</option>
                </select>
            </div>
            <div class="control-item">
                <label for="">Sortera</label>
                <select name="" id="sort-price">Sortera
                    <option value="standard">Standard</option>
                    <option value="low-high">Lågt - högt</option>
                    <option value="high-low">Högt - lågt</option>
                </select>
            </div>
            <div class="control-item"></div>
            <label for="">Rea</label>
            <button id="btn-discount"">20% rabatt</button>
        </div>
        <div class="product-container" id="product-container"></div>
    </div>    

    <script src="index.js"></script>
</body>
</html>
